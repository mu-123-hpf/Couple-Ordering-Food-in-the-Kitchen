server {
    listen 80;
    listen [::]:80;
    server_name kitchen.example.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/couple-kitchen-acme; }
    location / { return 308 https://kitchen.example.com$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kitchen.example.com;
    ssl_certificate /etc/letsencrypt/live/kitchen.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kitchen.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    access_log /var/log/nginx/couple-kitchen.access.log;
    error_log /var/log/nginx/couple-kitchen.error.log;
    location /download/ {
        alias /var/www/couple-kitchen-download/;
        autoindex off;
        types { application/vnd.android.package-archive apk; text/plain sha256; }
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "no-cache";
    }
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }
}
